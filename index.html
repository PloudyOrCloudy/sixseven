<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Glosario de Programación</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="fondo-halloween" aria-hidden="true"></div>
  <div class="calabazas-decorativas calabazas-izquierda" aria-hidden="true">
    <span>🎃</span><span>🎃</span><span>🎃</span><span>🎃</span>
  </div>
  <div class="calabazas-decorativas calabazas-derecha" aria-hidden="true">
    <span>🎃</span><span>🎃</span><span>🎃</span><span>🎃</span>
  </div>
  <!-- PANTALLA DE ACCESO (Esto es lo único que se ve al cargar la página) -->
  <section id="pantalla-login" class="seccion-login">
    <h2>Dame la contraseña pookieee, I LOV: </h2>
    <form id="formulario-login">
      <input type="password" id="clave-acceso" placeholder="pumking . . ." required>
      <button type="submit">🎃</button>
    </form>
    <p id="mensaje-error" style="color: red; display: none;">Calabaza incorrecta 😭</p>
  </section>
  <main id="contenido-protegido" style="display: none;">
    <!-- AÑADIR NOTAS  -->
    <section class="seccion-formulario">
      <h2>Añadir Nuevo Apunte</h2>
      <form id="formulario-guardar">
        <input type="text" id="nuevo-titulo" placeholder="Título (Ej: Centrar Div)" required>
        <textarea id="nueva-descripcion" placeholder="¿Para que se utiliza este método?" required></textarea>
        <input type="text" id="nuevas-keys"
          placeholder="Palabras clave (separadas por comas. Ej: flexbox, centrar, css)" required>
        <button type="submit">Guardar en mis notas</button>
      </form>
    </section>
    <hr>
    <!-- BUSCADOR -->
    <section class="seccion-buscador">
      <h2>Buscador de Métodos</h2>
      <form id="buscador-notas" class="search-box">
        <input type="search" id="input-busqueda" placeholder="Ej: centrar texto, cambiar color..." required>
        <button type="submit">Buscar</button>
      </form>
      <div id="contenedor-resultados" aria-live="polite"></div>
    </section>
    <section>
      <button id="btn-exportar"
        style="background-color: #ff9800; color: white; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; width: 100%;">
        Exportar mis notas guardadas a un archivo .json
      </button>
      <p class="ayuda-buscador">Para ver las notas de un lenguaje en concreto, escribe su nombre en el buscador (por ejemplo, css).</p>
    </section>
  </main>
  <script>
    const qwe = "Python";
    document.getElementById('formulario-login').addEventListener('submit', function (event) {
      event.preventDefault();
      const claveIntroducida = document.getElementById('clave-acceso').value;
      const loginBox = document.getElementById('pantalla-login');
      const contenido = document.getElementById('contenido-protegido');
      const msgError = document.getElementById('mensaje-error');
      if (claveIntroducida === qwe) {
        loginBox.style.display = "none";
        contenido.style.display = "block";
      } else {
        msgError.style.display = "block";
        document.getElementById('clave-acceso').value = "";
      }
    });
    // 2. FUNCIÓN
    async function obtenerTodasLasNotas() {
      try {
        const respuesta = await fetch('notas.json');
        const notasPredeterminadas = await respuesta.json();
        const notasCreadas = JSON.parse(localStorage.getItem('misNotasCreadas')) || [];
        return [...notasPredeterminadas, ...notasCreadas];
      } catch (error) {
        console.error("Error al cargar el archivo de notas:", error);
        return JSON.parse(localStorage.getItem('misNotasCreadas')) || [];
      }
    }
    function normalizarTexto(texto) {
      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }
    // 3. LÓGICA PARA GUARDAR UNA NUEVA NOTA
      document.getElementById('formulario-guardar').addEventListener('submit', function (event) {
      event.preventDefault();
      const titulo = document.getElementById('nuevo-titulo').value.trim();
      const descripcion = document.getElementById('nueva-descripcion').value.trim();
      const keysTexto = document.getElementById('nuevas-keys').value;
      const keysArray = keysTexto.split(',').map(key => key.trim().toLowerCase());
      const nuevaNota = {
        titulo: titulo,
        descripcion: descripcion,
        keys: keysArray
      };
      const notasCreadasActuales = JSON.parse(localStorage.getItem('misNotasCreadas')) || [];
      notasCreadasActuales.push(nuevaNota);
      localStorage.setItem('misNotasCreadas', JSON.stringify(notasCreadasActuales));
      document.getElementById('formulario-guardar').reset();
      alert('¡Apunte guardado con éxito!');
    });
    // 4. LÓGICA DEL BUSCADOR
      document.getElementById('buscador-notas').addEventListener('submit', async function (event) {
      event.preventDefault();
      const textoUsuario = normalizarTexto(document.getElementById('input-busqueda').value);
      const contenedor = document.getElementById('contenedor-resultados');
      // Limpiar los resultados de la búsqueda anterior
      contenedor.innerHTML = "";
      if (!textoUsuario) return;
      const todasLasNotas = await obtenerTodasLasNotas();
      const terminos = textoUsuario.split(/\s+/);
      const resultadosFiltrados = todasLasNotas
        .map((nota, indice) => {
          const tituloNota = normalizarTexto(nota.titulo);
          const descNota = normalizarTexto(nota.descripcion);
          const etiquetas = Array.isArray(nota.keys) ? nota.keys.map(normalizarTexto) : [];
          const campos = [tituloNota, descNota, ...etiquetas];
          const coincide = terminos.every(termino =>
            campos.some(campo => campo.includes(termino))
          );
          if (!coincide) return null;
          let puntuacion = 0;
          if (tituloNota === textoUsuario) puntuacion += 10;
          else if (tituloNota.includes(textoUsuario)) puntuacion += 6;
          if (etiquetas.some(etiqueta => etiqueta.includes(textoUsuario))) puntuacion += 4;
          if (descNota.includes(textoUsuario)) puntuacion += 2;
          terminos.forEach(termino => {
            if (tituloNota.includes(termino)) puntuacion += 3;
            if (etiquetas.some(etiqueta => etiqueta.includes(termino))) puntuacion += 2;
            if (descNota.includes(termino)) puntuacion += 1;
          });
          return { nota, indice, puntuacion };
        })
        .filter(resultado => resultado !== null)
        .sort((a, b) => b.puntuacion - a.puntuacion || a.indice - b.indice);
      // Si no hay resultados
      if (resultadosFiltrados.length === 0) {
        contenedor.innerHTML = "<p class='sin-resultados'>No se encontraron métodos relacionados.</p>";
        return;
      }
      const resumen = document.createElement('p');
      resumen.classList.add('ayuda-buscador');
      resumen.textContent = `${resultadosFiltrados.length} resultado${resultadosFiltrados.length === 1 ? '' : 's'} encontrado${resultadosFiltrados.length === 1 ? '' : 's'}.`;
      contenedor.appendChild(resumen);
      const tabla = document.createElement('table');
      tabla.classList.add('tabla-resultados');
      const encabezado = document.createElement('thead');
      const filaEncabezado = document.createElement('tr');
      ['Método', 'Descripción', 'Palabras clave'].forEach(texto => {
        const celda = document.createElement('th');
        celda.scope = 'col';
        celda.textContent = texto;
        filaEncabezado.appendChild(celda);
      });
      encabezado.appendChild(filaEncabezado);
      tabla.appendChild(encabezado);
      const cuerpo = document.createElement('tbody');
      resultadosFiltrados.forEach(({ nota }) => {
        const fila = document.createElement('tr');
        const titulo = document.createElement('th');
        titulo.scope = 'row';
        titulo.textContent = nota.titulo || 'Sin título';
        const descripcion = document.createElement('td');
        descripcion.textContent = nota.descripcion || 'Sin descripción disponible';
        const palabrasClave = document.createElement('td');
        palabrasClave.textContent = Array.isArray(nota.keys) ? nota.keys.join(', ') : '';
        fila.append(titulo, descripcion, palabrasClave);
        cuerpo.appendChild(fila);
      });
      tabla.appendChild(cuerpo);
      contenedor.appendChild(tabla);
    });
    // BOTÓN
    document.getElementById('btn-exportar').addEventListener('click', function () {
      const notasLocales = JSON.parse(localStorage.getItem('misNotasCreadas')) || [];
      // Conversión
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notasLocales, null, 2));
      const descargarAncla = document.createElement('a');
      descargarAncla.setAttribute("href", dataStr);
      descargarAncla.setAttribute("download", "mis-notas.json");
      document.body.appendChild(descargarAncla);
      descargarAncla.click();
      descargarAncla.remove();
    });
  </script>
</body>
</html>
