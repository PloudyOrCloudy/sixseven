<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Glosario de Programación</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- PANTALLA DE ACCESO (Esto es lo único que se ve al cargar la página) -->
  <section id="pantalla-login" class="seccion-login">
    <h2>Sistema Protegido</h2>
    <p>Introduce la clave para acceder a tus apuntes:</p>
    <form id="formulario-login">
      <input type="password" id="clave-acceso" placeholder="Escribe la clave aquí..." required>
      <button type="submit">Entrar</button>
    </form>
    <p id="mensaje-error" style="color: red; display: none;">Clave incorrecta. Inténtalo de nuevo.</p>
  </section>
  <!-- TODO EL CONTENIDO PROTEGIDO SE ENCAPSULA AQUÍ DENTRO -->
  <main id="contenido-protegido" style="display: none;">
    <!-- SECCIÓN 1: FORMULARIO PARA AÑADIR NOTAS  -->
    <section class="seccion-formulario">
      <h2>Añadir Nuevo Apunte</h2>
      <form id="formulario-guardar">
        <input type="text" id="nuevo-titulo" placeholder="Título (Ej: Centrar Div)" required>
        <textarea id="nueva-descripcion" placeholder="¿Para que se utiliza este método?" required></textarea>
        <input type="text" id="nuevas-keys" placeholder="Palabras clave (separadas por comas. Ej: flexbox, centrar, css)" required>
        <button type="submit">Guardar en mis notas</button>
      </form>
    </section>
    <hr>
    <!-- SECCIÓN 2: BUSCADOR -->
    <section class="seccion-buscador">
      <h2>Buscador de Métodos</h2>
      <form id="buscador-notas" class="search-box">
        <input type="search" id="input-busqueda" placeholder="¿Qué quieres hacer? Ej: cambiar color..." required>
        <button type="submit">Buscar</button>
      </form>
      
      <!-- Aquí se pintan los resultados -->
      <div id="contenedor-resultados"></div>
    </section>
  </main>
  <script>
    const qwe = "Python";
    document.getElementById('formulario-login').addEventListener('submit', function(event) {
      event.preventDefault();
      const claveIntroducida = document.getElementById('clave-acceso').value;
      const loginBox = document.getElementById('pantalla-login');
      const contenido = document.getElementById('contenido-protegido');
      const msgError = document.getElementById('mensaje-error');
      if (claveIntroducida === qwe) {
        loginBox.style.display = "none";
        contenido.style.display = "block";
      } else {
        msgError.style.display = "block";
        document.getElementById('clave-acceso').value = "";
      }
    });
    // 2. FUNCIÓN ASÍNCRONA PARA OBTENER TODAS LAS NOTAS (.json + localStorage)
    async function obtenerTodasLasNotas() {
      try {
        const respuesta = await fetch('notas.json');
        const notasPredeterminadas = await respuesta.json();
        
        const notasCreadas = JSON.parse(localStorage.getItem('misNotasCreadas')) || [];
        return [...notasPredeterminadas, ...notasCreadas];
      } catch (error) {
        console.error("Error al cargar el archivo de notas:", error);
        return JSON.parse(localStorage.getItem('misNotasCreadas')) || [];
      }
    }
    // 3. LÓGICA PARA GUARDAR UNA NUEVA NOTA
    document.getElementById('formulario-guardar').addEventListener('submit', function(event) {
      event.preventDefault();
      const titulo = document.getElementById('nuevo-titulo').value.trim();
      const descripcion = document.getElementById('nueva-descripcion').value.trim();
      const keysTexto = document.getElementById('nuevas-keys').value;
      const keysArray = keysTexto.split(',').map(key => key.trim().toLowerCase());
      const nuevaNota = {
        titulo: titulo,
        descripcion: descripcion,
        keys: keysArray
      };
      const notasCreadasActuales = JSON.parse(localStorage.getItem('misNotasCreadas')) || [];
      notasCreadasActuales.push(nuevaNota);
      localStorage.setItem('misNotasCreadas', JSON.stringify(notasCreadasActuales));
      document.getElementById('formulario-guardar').reset();
      alert('¡Apunte guardado con éxito!');
    });
    // 4. LÓGICA DEL BUSCADOR ASÍNCRONO
    document.getElementById('buscador-notas').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const textoUsuario = document.getElementById('input-busqueda').value.toLowerCase().trim();
      const contenedor = document.getElementById('contenedor-resultados');
      
      contenedor.innerHTML = ""; 

      const todasLasNotas = await obtenerTodasLasNotas();

      const resultadosFiltrados = todasLasNotas.filter(nota => {
        return nota.titulo.toLowerCase().includes(textoUsuario) || 
               nota.descripcion.toLowerCase().includes(textoUsuario) ||
               nota.keys.some(key => textoUsuario.includes(key) || key.includes(textoUsuario));
      });

      if (resultadosFiltrados.length === 0) {
        contenedor.innerHTML = "<p class='sin-resultados'>No se encontraron métodos relacionados.</p>";
        return;
      }

      resultadosFiltrados.forEach(nota => {
        const elementoNota = document.createElement('div');
        elementoNota.classList.add('resultado-item');
        
        elementoNota.innerHTML = `
          <h3>${nota.titulo}</h3>
          <p>${nota.descripcion}</p>
          <small>Etiquetas: ${nota.keys.join(', ')}</small>
        `;
        
        contenedor.appendChild(elementoNota);
      });
    });
  </script>
</body>
</html>
